<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Time Sensei</title>
<meta name="description" content="A game about stopping a timer at exactly the right moment. No counting, no tricks — just your sense of time." />
<style>
  :root {
    --bg: #100505;
    --panel: #1a0a0a;
    --line: #2a1410;
    --ink: #fff0e8;
    --ink-2: #c89880;
    --ink-3: #9a6b55;
    --accent: #f97316;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink-2);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { max-width: 34rem; padding: 4rem 1.25rem; width: 100%; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 0.9rem;
  }
  h1 {
    font-family: var(--mono);
    font-weight: 400;
    font-size: clamp(2rem, 8vw, 3rem);
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0 0 1rem;
  }
  .lede { font-size: 1.05rem; margin: 0 0 2.5rem; }
  .target {
    font-family: var(--mono);
    font-size: clamp(2.4rem, 12vw, 3.6rem);
    color: var(--ink);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    margin: 0 0 0.3rem;
  }
  .target-label {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 2.5rem;
  }
  .links { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0 0 2.5rem; }
  .links a {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.7rem 1.1rem;
  }
  .links a:hover, .links a:focus-visible { border-color: var(--accent); color: var(--accent); }
  footer { font-size: 0.85rem; color: var(--ink-3); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">iOS</p>
  <h1>Time Sensei</h1>
  <p class="lede">A game about one thing: stopping a timer at exactly the right
  moment. No counting, no tricks. Just feel.</p>

  <p class="target-label">Today's target</p>
  <p class="target">1.800s</p>

  <nav class="links">
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </nav>

  <footer>
    <p>Questions, bugs, or a data deletion request:
    <a href="mailto:kmertcansdev@gmail.com">kmertcansdev@gmail.com</a></p>
  </footer>

</div>
</body>
</html>
